/* Componentes de Deportes: inputs 48px, Geometria, Primario 600 e Info 500. */
@font-face{font-family:Geometria;src:url('/mlz/assets/agenda/Geometria.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--deportes-primary:#236999;--deportes-info:#006eff;--deportes-border:#5ba8d5;--deportes-text:#3d3d3d}
body{font-family:Geometria,'Century Gothic','Trebuchet MS',Arial,sans-serif;color:var(--deportes-text);font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
.field label{font-size:15px;font-weight:700;color:var(--deportes-primary)}
.field input:not([type="checkbox"]):not([type="radio"]),.field textarea,.field select,.deportes-select-trigger{
width:100%;height:48px;min-height:48px;border:1px solid var(--deportes-border);border-radius:4px;
background:#fff;color:var(--deportes-text);font-size:16px;line-height:24px;padding:10px 14px;
box-shadow:none;transition:background .15s,border-color .15s;
}
.field textarea{height:auto;min-height:110px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#8695a0;opacity:1}
.field input:not([type="checkbox"]):hover,.field textarea:hover,.deportes-select-trigger:hover{border-color:var(--deportes-primary)}
.field input:not([type="checkbox"]):focus,.field input:not([type="checkbox"]):focus-visible,
.field textarea:focus,.field textarea:focus-visible,
.deportes-select-trigger:focus,.deportes-select-trigger:focus-visible,.deportes-select-trigger[aria-expanded="true"]{
border:1px solid var(--deportes-info)!important;outline:none!important;
box-shadow:inset 0 0 0 1px var(--deportes-info)!important
}
.field input:disabled,.field textarea:disabled,.deportes-select-trigger:disabled{background:#f5f6f7;color:#81909b;cursor:not-allowed}
.field input[type="checkbox"]{width:20px;height:20px;min-width:20px;accent-color:var(--deportes-info);cursor:pointer}
.switchrow{font-size:16px;gap:11px}.switchrow:focus-within{border-radius:4px}
.btn{min-height:48px;padding:10px 22px;border-radius:4px;font-size:16px;font-weight:700;line-height:24px;
border:1px solid var(--deportes-border);color:var(--deportes-primary);background:#fff}
.btn.primary{background:var(--deportes-primary);color:#fff;border-color:var(--deportes-primary)}
.btn.primary:hover{background:#185681;border-color:#185681;filter:none}
.btn:not(.primary):hover{background:#edf6fb;filter:none}
.btn.danger{border-color:#c7394c;color:#b22c3a}
.btn.danger:hover{background:#fff2f4}
.btn:focus-visible,.iconbtn:focus-visible,.nav button:focus-visible{outline:2px solid var(--deportes-info);outline-offset:2px}
.iconbtn{width:40px;height:40px}.iconbtn .mi{font-size:22px}
.btn .mi{font-size:22px}
.deportes-select{position:relative;min-width:0}
.deportes-select select{display:none!important}
.deportes-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--deportes-primary);cursor:pointer;padding:8px 16px}
.deportes-select-trigger .deportes-selected{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.deportes-select-trigger .mi{font-size:24px;transition:transform .18s}
.deportes-select-trigger[aria-expanded="true"] .mi{transform:rotate(180deg)}
.deportes-menu{position:fixed;z-index:110;background:white;border:1px solid #c7d8e7;border-radius:8px;
box-shadow:0 14px 38px rgba(22,59,84,.17);padding:6px;max-height:min(340px,55vh);overflow:auto}
.deportes-menu-option{width:100%;min-height:46px;border:0;background:#fff;color:#3d3d3d;
border-radius:4px;text-align:left;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:16px}
.deportes-menu-option:hover,.deportes-menu-option:focus-visible{background:#edf6ff;outline:0}
.deportes-menu-option[aria-selected="true"]{background:#edf6ff;color:var(--deportes-primary);font-weight:700}
.deportes-menu-option .mi{margin-left:auto;color:var(--deportes-info)}
.deportes-sheet-backdrop{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.44)}
.deportes-sheet{position:fixed;z-index:151;left:0;right:0;bottom:0;background:white;border-radius:16px 16px 0 0;
box-shadow:0 -10px 35px rgba(0,0,0,.16);max-height:85dvh;display:flex;flex-direction:column;
padding-bottom:max(env(safe-area-inset-bottom),8px);animation:deportes-rise .2s ease-out}
.deportes-sheet-grab{height:5px;width:44px;border-radius:20px;background:#bac5cf;margin:12px auto 9px;flex:none}
.deportes-sheet-title{font-size:18px;color:var(--deportes-primary);font-weight:700;padding:10px 20px 17px;border-bottom:1px solid #e5edf3}
.deportes-sheet-list{padding:8px 12px;overflow:auto;overscroll-behavior:contain;min-height:0}
.deportes-sheet-actions{display:flex;gap:12px;padding:12px 16px 8px;border-top:1px solid #e5edf3}
.deportes-sheet-actions .btn{flex:1}
@keyframes deportes-rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.deportes-sheet{animation:none}}
@media(min-width:681px){.deportes-sheet-backdrop,.deportes-sheet{display:none!important}}
@media(max-width:680px){.deportes-menu{display:none!important}.deportes-sheet-actions .btn{padding-inline:8px}}
/* Scrollbars equivalentes a los desplegables de la agenda. */
.deportes-menu::-webkit-scrollbar,.deportes-sheet-list::-webkit-scrollbar,.dialog-content::-webkit-scrollbar{width:6px}
.deportes-menu::-webkit-scrollbar-thumb,.deportes-sheet-list::-webkit-scrollbar-thumb,.dialog-content::-webkit-scrollbar-thumb{background:#adbdca;border-radius:12px}

function action(type,id,index){if(type==='list'){view='list';editId=null;draft=null;render();return}if(type==='registrations'){view='registrations';render();return}if(type==='public'){window.open('https://santiagom96.github.io/mlz/prototipos/deportes_formulario_resumen_compacto.html','_blank','noopener');return}if(type==='new'){editId=null;draft={id:'new-'+Date.now(),sourceId:'NUEVA',name:'',min:5,max:59,ageLabel:'Todas las edades',pcd:false,sex:'Mixto',previousTest:false,venue:'',address:'',tipo:'Recreativo',intensidad:'Bajo',commissions:[],categoriaTipoGlobal:'Artes marciales y combate'};view='edit';render();return}if(type==='edit'){editId=id;draft=structuredClone(records.find(a=>a.id===id));view='edit';render();return}if(type==='duplicate'){let a=structuredClone(records.find(x=>x.id===id));a.id='copy-'+Date.now();a.sourceId='COPIA';a.name+=' (copia)';records.unshift(a);save();render();return}if(type==='toggle'){let a=records.find(x=>x.id===id);a._hidden=!a._hidden;save();render();return}if(type==='delete'){modalType='delete';modalIndex=records.findIndex(x=>x.id===id);renderModal();return}if(type==='clear'){filterText='';filterVenue='';filterState='';page=0;render();return}if(type==='prev'){page=Math.max(0,page-1);render();return}if(type==='next'){let count=records.filter(x=>(!filterText||(x.name+' '+x.sourceId+' '+x.categoriaTipoGlobal).toLowerCase().includes(filterText.toLowerCase()))&&(!filterVenue||x.venue===filterVenue)&&(!filterState||status(x)===filterState)).length;page=Math.min(Math.max(0,Math.ceil(count/10)-1),page+1);render();return}if(type==='save-activity'){let form=document.getElementById('activity-form');if(!form.reportValidity())return;let data=new FormData(form);draft.name=String(data.get('name')).trim();draft._hidden=data.get('state')==='Oculta';draft.categoriaTipoGlobal=String(data.get('category'));draft.tipo=String(data.get('tipo'));draft.intensidad=String(data.get('intensidad'));draft.sex=String(data.get('sex'));draft.min=Number(data.get('min'));draft.max=Number(data.get('max'));draft.venue=String(data.get('venue')).trim();draft.address=String(data.get('address'));draft.pcd=data.has('pcd');draft.previousTest=data.has('previousTest');if(draft.min>draft.max){alert('La edad mínima no puede ser mayor a la máxima.');return}if(!draft.name||!draft.venue){alert('Completá nombre y sede.');return}if(editId){records[records.findIndex(a=>a.id===editId)]=draft}else records.unshift(draft);save();view='list';editId=null;draft=null;page=0;render();return}if(type==='add-commission'||type==='edit-commission'){syncDraftForm();modalType='commission';modalIndex=type==='add-commission'?-1:index;renderModal();return}if(type==='dup-commission'){syncDraftForm();let c=structuredClone(draft.commissions[index]);c.id='COM-COPIA-'+Date.now();draft.commissions.splice(index+1,0,c);render();return}if(type==='remove-commission'){syncDraftForm();if(confirm('¿Eliminar esta comisión del formulario?'))draft.commissions.splice(index,1);render();return}if(type==='export'){alert('Todavía no hay inscripciones reales disponibles para exportar.');return}}

function enhanceDeportesSelects(root){
 root.querySelectorAll('.field select').forEach(select=>{
  if(select.parentElement.classList.contains('deportes-select'))return;
  const wrap=document.createElement('div');wrap.className='deportes-select';
  select.parentElement.insertBefore(wrap,select);wrap.append(select);
  const trigger=document.createElement('button');trigger.type='button';trigger.className='deportes-select-trigger';
  trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
  const label=wrap.parentElement.querySelector('label');
  if(label)trigger.setAttribute('aria-label',label.textContent.trim());
  const txt=document.createElement('span');txt.className='deportes-selected';
  const chevron=document.createElement('span');chevron.className='mi';chevron.textContent='expand_more';
  trigger.append(txt,chevron);wrap.append(trigger);
  const sync=()=>{txt.textContent=select.selectedOptions[0]?.textContent||'Seleccionar';trigger.disabled=select.disabled;trigger.setAttribute('aria-disabled',String(select.disabled))};
  sync();select.addEventListener('change',sync);
  trigger.addEventListener('click',()=>openDeportesSelect(wrap,select,trigger,label?.textContent.trim()||'Seleccionar'));
  trigger.addEventListener('keydown',ev=>{if(['ArrowDown','ArrowUp','Enter',' '].includes(ev.key)){ev.preventDefault();openDeportesSelect(wrap,select,trigger,label?.textContent.trim()||'Seleccionar')}});
 });
}
function openDeportesSelect(wrap,select,trigger,title){
 if(select.disabled)return;
 if(deportesActive===wrap){closeDeportesSelect();return}
 closeDeportesSelect();deportesActive=wrap;trigger.setAttribute('aria-expanded','true');
 const mobile=matchMedia('(max-width:680px)').matches;
 let pending=select.selectedIndex;
 const overlay=document.createElement('div');overlay.className=mobile?'deportes-sheet-backdrop':'deportes-menu';
 const list=document.createElement('div');list.className=mobile?'deportes-sheet-list':'';
 function makeOptions(){
  list.innerHTML='';
  [...select.options].forEach((option,index)=>{
   const item=document.createElement('button');item.type='button';item.className='deportes-menu-option';
   item.setAttribute('role','option');item.setAttribute('aria-selected',String(index===pending));
   item.textContent=option.textContent;
   if(index===pending){const check=document.createElement('span');check.className='mi';check.textContent='check';item.append(check)}
   item.addEventListener('click',()=>{
    if(mobile){pending=index;makeOptions()}
    else {select.selectedIndex=index;select.dispatchEvent(new Event('change',{bubbles:true}));closeDeportesSelect(true)}
   });
   list.append(item)
  })
 }
 makeOptions();
 if(mobile){
  const sheet=document.createElement('div');sheet.className='deportes-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label',title);
  const grab=document.createElement('div');grab.className='deportes-sheet-grab';
  const heading=document.createElement('div');heading.className='deportes-sheet-title';heading.textContent=title;
  const actions=document.createElement('div');actions.className='deportes-sheet-actions';
  const clear=document.createElement('button');clear.type='button';clear.className='btn';clear.textContent='Limpiar';
  clear.addEventListener('click',()=>{const first=[...select.options].findIndex(x=>x.value==='');pending=first>=0?first:0;makeOptions()});
  const confirm=document.createElement('button');confirm.type='button';confirm.className='btn primary';confirm.textContent='Confirmar';
  confirm.addEventListener('click',()=>{select.selectedIndex=pending;select.dispatchEvent(new Event('change',{bubbles:true}));closeDeportesSelect()});
  actions.append(clear,confirm);sheet.append(grab,heading,list,actions);
  overlay.addEventListener('click',()=>closeDeportesSelect(true));document.body.append(overlay,sheet);
  deportesPopup=document.createElement('div');deportesPopup.append(overlay,sheet);document.body.append(deportesPopup);
  document.body.style.overflow='hidden';
 } else {
  overlay.setAttribute('role','listbox');overlay.setAttribute('aria-label',title);overlay.append(list);
  const rect=trigger.getBoundingClientRect();
  overlay.style.left=Math.max(8,Math.min(rect.left,innerWidth-rect.width-8))+'px';
  overlay.style.width=rect.width+'px';
  const below=innerHeight-rect.bottom;
  overlay.style.top=(below<220&&rect.top>below?Math.max(8,rect.top-350):rect.bottom+6)+'px';
  document.body.append(overlay);deportesPopup=overlay;
 }
 list.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
}
document.addEventListener('pointerdown',ev=>{if(!deportesActive)return;if(!deportesActive.contains(ev.target)&&!deportesPopup?.contains(ev.target))closeDeportesSelect()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&deportesActive){ev.stopPropagation();closeDeportesSelect(true)}});

render();
</script></body></html>
