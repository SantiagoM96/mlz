.sports-filters .sf-primary,.sports-filters .sf-clear{height:48px;border-radius:4px;font-weight:700;border:0}
.sports-filters .sf-primary{background:var(--sf-blue);color:#fff;flex:1}
.sports-filters .sf-primary:hover{background:#174c72}
.sports-filters .sf-clear{background:#fff;color:var(--sf-blue);padding:0 18px}
.sports-filters .sf-clear:hover{background:#eff6fc}
.sports-filters .sf-panel-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;scrollbar-width:thin;scrollbar-color:#c4d2dc transparent}
.sports-filters .sf-section{padding:0 0 8px;margin:0 0 8px;border-bottom:1px solid #e7edf2}
.sports-filters .sf-section:last-child{border:0}
.sports-filters .sf-section-title{width:100%;min-height:44px;padding:8px;border:none;border-radius:4px;background:#fff;color:var(--sf-blue);font-size:19px;font-weight:750;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sports-filters .sf-section-title:hover{background:#eff7fd}
.sports-filters .sf-section-title span:last-child{font-size:22px;font-weight:400}
.sports-filters .sf-checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;padding:7px 0 12px}
.sports-filters .sf-check{display:flex;align-items:flex-start;gap:6px;padding:6px 3px;min-width:0;cursor:pointer;color:var(--sf-ink);font-size:16px;line-height:24px}
.sports-filters .sf-check:hover{background:#eff7fd;border-radius:4px}
.sports-filters .sf-check input{accent-color:var(--sf-blue);flex:0 0 20px;width:20px;height:20px;margin:2px 1px 0 0;cursor:pointer}
.sports-filters .sf-check span{min-width:0;overflow-wrap:anywhere}
.sports-filters .sf-panel-footer{padding:16px;flex:none;border-top:1px solid #ddd;display:flex;gap:8px;background:white}
.sports-filters .sf-panel-footer .sf-clear{flex:1;border:1px solid #c8d9e3}
.sports-filters .sf-switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0 20px;margin-bottom:16px;border-bottom:1px solid #e7edf2}
.sports-filters .sf-switchrow strong{display:block;color:var(--sf-blue);font-size:18px;line-height:24px}
.sports-filters .sf-switchrow small{display:block;color:#777;font-size:14px;margin-top:5px;line-height:20px}
.sports-filters .sf-switch{display:inline-flex;align-items:center;position:relative;width:44px;height:26px;flex:0 0 44px;cursor:pointer}
.sports-filters .sf-switch input{position:absolute;inset:0;opacity:0;z-index:2;cursor:pointer}
.sports-filters .sf-track{background:#d2d9df;width:44px;height:26px;border-radius:20px;position:relative;transition:background .15s}
.sports-filters .sf-track::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003;left:3px;top:3px;transition:transform .15s}
.sports-filters .sf-switch input:checked+.sf-track{background:var(--sf-bright)}
.sports-filters .sf-switch input:checked+.sf-track::after{transform:translateX(18px)}
.sports-filters .sf-switch input:focus-visible+.sf-track{outline:3px solid var(--sf-blue);outline-offset:3px}
.sports-filters .sf-active-tags{margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sports-filters .sf-active-tags[hidden]{display:none}
.sports-filters .sf-tags-scroll{display:contents}
.sports-filters .sf-tag{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 8px;border-radius:4px;background:var(--sf-bright);color:#fff;font-size:15px;line-height:24px}
.sports-filters .sf-tag button{background:transparent;border:0;color:#fff;font-size:21px;display:grid;place-items:center;width:19px;height:19px;line-height:1;padding:0}
.sports-filters .sf-tag button:hover{background:#ffffff30}
.sports-filters .sf-tag-clear{border:0;background:#fff;color:var(--sf-blue);font-weight:700;padding:7px 8px;white-space:nowrap}
.sports-filters .sf-backdrop{display:none}
.sports-filters .sf-mobileclose{display:none}
.sports-filters .sf-null{padding:14px 16px;color:#777;font-size:14px}
.sports-filters .sf-popup-caption{color:#7b8791;font-size:12px;line-height:17px;padding:8px 16px 0}
.sports-filters .sf-hint{color:#747474;font-size:12px;line-height:1.5;margin-top:10px}
@keyframes sf-show{from{opacity:.6;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1060px){.sports-filters .sf-filterbar{grid-template-columns:1fr;gap:12px}.sports-filters .sf-controls{gap:12px}}
@media(max-width:680px){
 body.sf-locked{overflow:hidden}
 .sports-filters .sf-filterbar{display:flex;flex-direction:column;gap:16px}
 .sports-filters .sf-search,.sports-filters .sf-controls{width:100%}
 .sports-filters .sf-controls{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:12px}
 .sports-filters .sf-holder-more{flex:auto}
 .sports-filters .sf-holder-more .sf-control{padding-left:9px;padding-right:8px;gap:4px}
 .sports-filters .sf-holder-more .sf-control-label{font-size:14px}
 .sports-filters .sf-holder-age{display:none}
 .sports-filters .sf-control{height:48px;font-size:16px}
 .sports-filters .sf-backdrop.visible{display:block;position:fixed;inset:0;background:#132f4590;z-index:99}
 .sports-filters .sf-popup,.sports-filters .sf-holder-age .sf-popup,.sports-filters .sf-more-mount>.sf-popup{position:fixed;inset:auto 0 0 0;top:auto;left:0;right:0;z-index:101;width:100%;max-width:100%;height:min(86dvh,820px);max-height:86dvh;border:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 28px #0003;animation:sf-up .22s ease-out}
 .sports-filters .sf-popup-header{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:10px 16px;font-weight:750;font-size:20px;color:var(--sf-blue);border-bottom:1px solid #e6ecf0}
 .sports-filters .sf-mobileclose{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:#f1f6fa;color:var(--sf-blue);font-size:23px}
 .sports-filters .sf-popup-search{margin:14px 16px 0;width:calc(100% - 32px)}
 .sports-filters .sf-popup-options{margin:8px 0}
 .sports-filters .sf-popup-actions{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
 .sports-filters .sf-panel-scroll{padding:16px}
 .sports-filters .sf-panel-footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
 .sports-filters .sf-section-title{font-size:18px}
 .sports-filters .sf-check{font-size:14px;line-height:21px}
 .sports-filters .sf-checkgrid{gap:5px 8px}
 .sports-filters .sf-switchrow strong{font-size:16px}
 .sports-filters .sf-switchrow small{font-size:12px}
 .sports-filters .sf-active-tags{display:flex;flex-wrap:nowrap;overflow:hidden;margin-top:9px;gap:0;width:100%}
 .sports-filters .sf-tags-scroll{display:flex;overflow-x:auto;min-width:0;flex:1;gap:8px;scrollbar-width:none;padding-right:8px}
 .sports-filters .sf-tags-scroll::-webkit-scrollbar{display:none}
 .sports-filters .sf-tag{flex:none;white-space:nowrap}
 .sports-filters .sf-tag-clear{flex:none;border-left:1px solid #cbd8e1;padding:4px 8px}
}
@keyframes sf-up{from{transform:translateY(26px);opacity:.7}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.sports-filters .sf-popup{animation:none}}


/* Deportes · Escala visual de Agenda Anual / Comunidad Lomas
   Sólo presentación: todas las actividades y rutas se conservan. */
:root{--blue:var(--primario-600);--navy:var(--primario-600);--sky:#006eff;--accent:#006eff;--text:#3d3d3d;--line:#e7e7e7;--outline:#5ba8d5}
html{scroll-behavior:auto}
body{font-family:Geometria,'Century Gothic','Trebuchet MS',Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--text)}
h1,h2,h3,p{margin-top:0}
a,button,input,select,textarea{font-family:inherit}
.topbar{height:88px;min-height:88px;padding:0 32px;background:var(--primario-600)}
.topbar img{width:137px;max-height:62px;object-fit:contain}
.topbar .identity{gap:12px;padding:8px 10px}
.avatar{width:40px;height:40px;font-size:13px}
.identity strong{font-size:14px;line-height:20px}
.identity small{font-size:12px;line-height:18px}
.account-menu{top:78px;font-size:14px}
.shell{grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 168px)}
.sidebar{padding:24px 14px 26px;gap:8px;background:#f0f5fb}
.nav{min-height:46px;gap:13px;padding:12px 13px;font-size:13px;line-height:18px;border-radius:4px}
.nav .mi{width:19px;height:19px}
.nav.inbox{margin-bottom:16px;min-height:48px}
.nav .nbadge{font-size:12px;min-width:23px;padding:3px 7px;text-align:center}
.content{padding:32px 36px 75px;max-width:1630px}
.breadcrumb{font-size:13px;gap:12px;margin-bottom:24px;line-height:20px;flex-wrap:wrap}
.breadcrumb svg{width:14px;height:14px}
.page-title,.d-title,.form-title{color:var(--primario-600);font-size:32px;line-height:1.25;letter-spacing:-.5px;font-weight:750}
.page-title{margin:0 0 12px}
.small-title{font-size:22px;line-height:30px;color:var(--primario-600);margin:26px 0 14px;font-weight:700}
.footer{min-height:110px;gap:28px;padding:20px 28px}
.foot-logo{width:205px;height:57px}
.footer strong{font-size:15px}
.wa{min-height:38px;font-size:13px;padding:9px 14px;border-radius:4px}
.footer a,.foot-social{font-size:12px}
.social-circles{font-size:18px}
.prototype-note,.catalog-footnote{font-size:12px;line-height:19px;margin-top:20px}
.brief-status{font-size:14px}
.data-est{font-size:13px;color:#b33939;line-height:1.4}

/* Buscador: misma jerarquía de Agenda Anual */
.catalog-intro{font-size:17px;line-height:26px;color:#555;margin:0 0 23px;max-width:1070px}
.catalog-intro p{margin-bottom:8px}
.sports-filters{margin:24px 0 0;font-size:16px;line-height:24px}
.sports-filters .sf-filterbar{gap:16px}
.sports-filters .sf-controls{gap:16px}
.sports-filters .sf-control,.sports-filters .sf-search input{height:48px;font-size:16px}
.sports-filters .sf-check{font-size:16px;line-height:24px}
.sports-filters .sf-section-title{font-size:20px}
.sports-filters .sf-popup-caption{font-size:13px}
.sports-filters .sf-hint{font-size:13px}
.sports-filters .sf-tag{font-size:16px}
.catalog-counter{margin:24px 0 20px;min-height:48px;font-size:18px;line-height:26px;color:#3d3d3d}
.sort-btn{min-height:48px;border:1px solid #5ba8d5;border-radius:4px;font-size:16px;font-weight:500;color:var(--primario-600);padding:0 18px}
.sort-btn:hover{background:#f0f7fc}
.catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}
.catalog-card{border:1px solid #e7e7e7;border-radius:8px;min-width:0;min-height:430px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.catalog-card:hover{border-color:#bed8ed;box-shadow:0 8px 23px #174d7017;transform:translateY(-2px)}
.card-art{position:relative;height:154px;flex:0 0 154px;background-image:radial-gradient(circle at 14% -35%,rgba(255,255,255,.44) 0 37%,transparent 37.5%),radial-gradient(circle at 117% 137%,rgba(35,105,153,.13) 0 38%,transparent 38.5%),linear-gradient(115deg,#c8e0f5,#dcebf9) !important;background-size:cover!important;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden}
.catalog-card:nth-child(3n+2) .card-art{background-image:radial-gradient(circle at 14% -35%,rgba(255,255,255,.44) 0 37%,transparent 37.5%),radial-gradient(circle at 117% 137%,rgba(35,105,153,.10) 0 38%,transparent 38.5%),linear-gradient(115deg,#d4e4f5,#e7effa)!important}
.catalog-card:nth-child(3n) .card-art{background-image:radial-gradient(circle at 14% -35%,rgba(255,255,255,.44) 0 37%,transparent 37.5%),radial-gradient(circle at 117% 137%,rgba(35,105,153,.12) 0 38%,transparent 38.5%),linear-gradient(115deg,#c8e6dc,#d9f0e8)!important}
.sport-graphic{width:74px;height:74px;color:var(--primario-600);position:relative;z-index:1;stroke-width:1.7;opacity:.93}
.card-body{padding:16px 24px 21px;gap:0;flex:1}
.card-cat{font-size:15px;line-height:22px;margin-bottom:10px;color:#888;font-weight:500;letter-spacing:.012em}
.card-name{font-size:22px;line-height:29px;margin:0 0 14px;min-height:0;font-weight:700;color:var(--primario-600);overflow-wrap:anywhere}
.adapted{font-size:13px;line-height:20px;border-radius:5px;padding:3px 8px;margin:0 0 11px;background:#ecddff;color:#873fd9}
.card-info{font-size:16px;line-height:23px;gap:9px;margin-bottom:12px;color:#3d3d3d;align-items:flex-start}

.card-info svg{width:20px;height:20px}
.card-info .sub{font-size:15px;line-height:22px;margin-top:3px;color:#666;font-weight:400}
.card-info .data-est{display:inline;font-size:12px}
.card-link{font-size:16px;line-height:24px;margin-top:auto;padding:15px 0 0;font-weight:650;color:var(--primario-600)}
.card-link:hover{text-decoration:underline}
.show-more-wrap{padding:30px 0 4px}
.show-more{min-height:48px;border-radius:4px;padding:0 26px;font-size:16px;background:var(--primario-600)}

.selector-title{font-size:24px;line-height:32px;color:var(--primario-600);margin:0 0 7px}
.selector-sub{font-size:16px;line-height:24px;margin:0 0 18px}
.option-list{gap:12px;max-height:560px;padding:1px 3px 4px 1px}

.opt-days{font-size:16px;line-height:23px;font-weight:700;margin:0 0 8px}

.minor-toggle{font-size:16px;line-height:24px;margin:18px 0 22px;gap:10px}

.info-banner{font-size:16px;line-height:24px;border-radius:7px;padding:15px 17px;gap:12px;margin-bottom:24px}

}
@media(max-width:850px){

/* SUPERFICIE ELÁSTICA DEL BOTTOM SHEET (mobile)
   El drawer sigue anclado a bottom:0. Tirar hacia arriba incrementa su altura
   (no traslada la caja); el padding compensa para que el contenido no salte.
   La barra acompaña la posición del borde superior, como un asa elástica. */

 .agenda-sports .menu.sheet-stretching,

   animation:none!important;
   transition:none!important;
   transform:translate3d(0,0,0)!important;
   box-sizing:border-box!important;
   bottom:0!important;
   top:auto!important;
   height:calc(var(--sheet-base-height) + var(--sheet-stretch-y,0px))!important;
   max-height:calc(var(--sheet-base-height) + var(--sheet-stretch-y,0px))!important;
   padding-top:calc(var(--sheet-base-padding-top,0px) + var(--sheet-stretch-y,0px))!important;
   will-change:height,padding-top;
 }
 .agenda-sports .sheet-stretching>.sheet-grab-area{
   transform:translate3d(0,calc(-1 * var(--sheet-stretch-y,0px)),0)!important;
   transition:none!important;
 }
 .agenda-sports .menu.sheet-stretch-rebounding,
 .agenda-sports .panel.sheet-stretch-rebounding,

function ico(name,size=20){
 const symbol=GOOGLE_ICON_NAMES[name]||'description';
 const path=GOOGLE_ICON_PATHS[name]||GOOGLE_ICON_PATHS.file;
 return '<span class="g-icon" style="--g-icon-size:'+size+'px" aria-hidden="true"><span class="material-symbols-outlined g-font-icon">'+symbol+'</span><svg class="g-svg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><path d="'+path+'"/></svg></span>';
}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function ageText(a){return a.ageLabel || (a.min<3?'De '+Math.round(a.min*12)+' a '+Math.round(a.max*12)+' meses':a.max>=99?'Desde '+a.min+' años':'De '+a.min+' a '+a.max+' años')}
function hourLabel(s){return !/^\d{1,2}:\d{2}$/.test(s.start)||!/^\d{1,2}:\d{2}$/.test(s.end)?'Horario a confirmar':s.start+' a '+s.end}
function getCard(id){return ACTIVITIES.find(a=>a.id===id)||ACTIVITIES.find(a=>a.name==='Escuelita de patín')||ACTIVITIES[0]}
function getParams(){return new URLSearchParams((location.hash.slice(1).split('?')[1]||''))}
function days(s){return String(s).replaceAll(' y ',' y ')}
function formatSchedule(c){return c.schedule.map(s=>days(s.days)+' · '+hourLabel(s)).join(' / ')}
function mapVenueQuery(a){
 // Los datos provienen de la planilla; no se inventan calles ni coordenadas.
 const address=String(a.address||'').replace(/\s*[·|]\s*/g,', ').trim();
 const venue=String(a.venue||'').trim();
 const place=/\d/.test(address)?address:[venue,address].filter(Boolean).join(', ');
 return /lomas de zamora/i.test(place)?place:place+', Lomas de Zamora, Buenos Aires, Argentina';
}
function mapTileHTML(a){
 // Vista estática de mosaicos: jamás incorpora fichas, popovers ni UI de proveedores.
 // Coordenadas del acceso al parque y del Natatorio Guyo Sember, verificadas
 // independientemente de las direcciones postales mostradas al usuario.
 const sember=/Sember/i.test(String(a.venue||''));
 const lat=sember?-34.7581309:-34.7678005;
 const lon=sember?-58.396117:-58.4326553;
 const zoom=16;
 const scale=Math.pow(2,zoom)*256;
 const pixelX=(lon+180)/360*scale;
 const radians=lat*Math.PI/180;
 const pixelY=(1-Math.asinh(Math.tan(radians))/Math.PI)/2*scale;
 const tileX=Math.floor(pixelX/256),tileY=Math.floor(pixelY/256);
 const offsetX=pixelX%256,offsetY=pixelY%256;
 const tiles=[];
 for(let dy=-1;dy<=1;dy++){
  for(let dx=-1;dx<=1;dx++){
   const x=tileX+dx,y=tileY+dy;
   const left=dx*256-offsetX,top=dy*256-offsetY;
   tiles.push('<img class="map-tile" src="https://tile.openstreetmap.org/'+zoom+'/'+x+'/'+y+'.png" alt="" aria-hidden="true" loading="lazy" draggable="false" style="left:'+left.toFixed(2)+'px;top:'+top.toFixed(2)+'px">');
  }
 }
 return '<div class="map-tile-layer" aria-hidden="true">'+tiles.join('')+'</div>'
  +'<span class="map-location-pin" aria-hidden="true"></span>'
  ;
}
function siteURL(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapVenueQuery(a))}

function sharePage(){if(navigator.share){navigator.share({title:'Agenda de deportes de Lomas',url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>notify('Enlace copiado')).catch(()=>notify('Enlace disponible en la barra de direcciones'))}else notify('Copiá la dirección de esta página para compartir')}

function shareRegistration(target){
 const url=location.href;
 const title='Inscripción en Agenda de Deportes de Lomas';
 if(target==='whatsapp') {window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(title+' '+url),'_blank','noopener,noreferrer');return;}
 if(target==='facebook') {window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener,noreferrer');return;}
 const copy=()=>{ if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(url).then(()=>notify('Enlace copiado')).catch(()=>notify('Copiá el enlace de la barra de direcciones'));
 notify('Copiá el enlace de la barra de direcciones'); return Promise.resolve(); };
 copy();
 if(target==='instagram')notify('Enlace copiado para compartir por Instagram');
}

 function render(){renderMenus();renderTags();renderResults()}
 const onClick=e=>{
  let target=e.target.closest('[data-remove],[data-toggle],[data-clear],[data-close],[data-collapse]');
  if(target&&root.contains(target)){
   if(target.dataset.remove){
    e.preventDefault();
    const k=target.dataset.remove,v=target.dataset.value;
    if(k==='pcd')pcd=false;
    else if(Array.isArray(selected[k]))selected[k]=selected[k].filter(item=>item!==v);
    shown=9;render();
   }
   else if(target.dataset.toggle){if(target.matches('input[type=checkbox],input[type=radio]'))return;e.preventDefault();toggle(target.dataset.toggle,target.dataset.value)}
   else if(target.dataset.clear)clear(target.dataset.clear);
   else if(target.dataset.close)close();
   else if(target.dataset.collapse){
    // No reconstruir el panel: los controles y el scroll deben permanecer estables.
    const key=target.dataset.collapse;
    const section=target.closest('.section');
    const willExpand=collapsed.has(key);
    if(willExpand)collapsed.delete(key);else collapsed.add(key);
    target.setAttribute('aria-expanded',String(willExpand));
    target.querySelector('span.up, span:not(.g-icon):not(.material-symbols-outlined)')?.classList.toggle('up',willExpand);
    const content=section?.querySelector('.checks');
    if(content)content.hidden=!willExpand;
   }
   return}
  const b=e.target.closest('#localBtn,#dateBtn,#moreBtn');if(b&&root.contains(b)){open=open===({localBtn:'loc',dateBtn:'age',moreBtn:'more'}[b.id])?null:({localBtn:'loc',dateBtn:'age',moreBtn:'more'}[b.id]);query='';renderMenus();return}
  if(open&&(!e.target.closest('.menu,.panel')||e.target.id==='sheetBackdrop'))close()
 };
 const onChange=e=>{const target=e.target;if(target.matches('input[data-pcd]')){pcd=target.checked;shown=9;render()}else if(target.matches('.checks input:is([type=checkbox],[type=radio])[data-toggle]'))toggle(target.dataset.toggle,target.dataset.value)};
 const onInput=e=>{if(e.target.id==='search'){search=e.target.value;shown=9;renderResults()}};
 const closeSort=(restoreFocus=false)=>{const menu=el('sortMenu');if(!menu)return;const wasOpen=!menu.hidden;menu.hidden=true;el('sortBtn').setAttribute('aria-expanded','false');el('sortBackdrop').classList.remove('visible');document.body.classList.remove('sort-sheet-open');if(restoreFocus&&wasOpen)el('sortBtn').focus()};
 const openSort=()=>{if(open)close();const menu=el('sortMenu');const mobile=matchMedia('(max-width:680px)').matches;menu.hidden=false;menu.setAttribute('role',mobile?'dialog':'group');if(mobile){menu.setAttribute('aria-modal','true');el('sortBackdrop').classList.add('visible');document.body.classList.add('sort-sheet-open');menu.querySelector('.sheet-grab-area')?.focus({preventScroll:true})}else menu.removeAttribute('aria-modal');el('sortBtn').setAttribute('aria-expanded','true')};
 const onDocClick=e=>{if(!e.target.closest('.sort-wrap')&&!matchMedia('(max-width:680px)').matches)closeSort()};
 const onKey=e=>{if(e.key==='Escape'){if(open)close();closeSort(true)}};
 const onResize=()=>{fit();fitSimpleMenus();const mobile=matchMedia('(max-width:680px)').matches;document.body.classList.toggle('sheet-open',!!open&&mobile);el('sheetBackdrop').classList.toggle('visible',!!open&&mobile);if(!mobile)closeSort()};
 root.addEventListener('click',onClick);root.addEventListener('change',onChange);root.addEventListener('input',onInput);
 el('sheetBackdrop').addEventListener('click',close);
 el('loadBtn').addEventListener('click',()=>{shown+=9;renderResults()});
 el('viewBtn').addEventListener('click',()=>{map=!map;renderResults()});
 el('sortBtn').addEventListener('click',e=>{e.stopPropagation();if(el('sortMenu').hidden)openSort();else closeSort(true)});

 el('sortBackdrop').addEventListener('click',()=>closeSort(true));

/* La posición de anclaje depende del layout, nunca del scroll.

function syncDetailPanelViewport(){
 const grid=document.querySelector('.detail-page .details-layout');
 const panel=grid?.querySelector(':scope > .details-right');
 if(!panel)return;
 panel.style.removeProperty('height');
 if(window.matchMedia('(max-width:1199px)').matches){
   panel.style.removeProperty('--detail-sticky-top');
   return;
 }
 // La caja del grid no es sticky: su posición en el documento no cambia
 // cuando la columna derecha se queda anclada al desplazarse la izquierda.
 const documentTop=grid.getBoundingClientRect().top + window.scrollY;
 const screenHeight=window.visualViewport?.height || window.innerHeight;
 const top=Math.max(112,Math.min(Math.round(documentTop),Math.max(112,screenHeight-370)));
 panel.style.setProperty('--detail-sticky-top',top+'px');
}
let detailPanelFrame=0;

tion-sub">Condiciones médicas preexistentes (marcá todas las que correspondan)</p><div class="checkline">${['Asma','Hepatitis','Hipertensión','Sobrepeso','Diabetes','Te dializás','Epilepsia','Hernias','Trastornos osteoarticulares','Trastornos cardíacos'].map(x=>`<label><input type="checkbox" name="patologias" value="${x}"> ${x}</label>`).join('')}</div><div class="fields">${field('Alergias','alergias','Ingresar alergias','span2')}${field('Otros','otros','Ingresar otros','span2')}${field('Intervenciones quirúrgicas','cirugias','Ingresar intervenciones','span2')}${field('Intolerancia o alergia a medicamentos','intolerancia','Ingresar intolerancia o alergia')}${field('Medicamentos habituales','medicamentos','Ingresar medicamentos')}${field('Limitación física','limitacion','Ingresar limitación física')}${field('¿Necesitás ayuda en la marcha?','marcha','Ingresar detalle')}</div></section><section class="form-section"><h2>DOCUMENTACIÓN A ADJUNTAR</h2><div class="uploads">${upload('Certificado único de discapacidad (CUD)','archivo_cud',5)}${upload('Frente DNI','archivo_frente',2)}${upload('Dorso DNI','archivo_dorso',5)}${upload('Adjuntar Apto Médico Competitivo','archivo_comp',5)}${upload('Adjuntar Apto Médico Federado','archivo_fed',2)}</div></section><label class="minor-toggle"><input type="checkbox" id="terms" required> Acepto términos y condiciones</label><div class="submit-row"><button type="submit" class="submit-btn">Enviar</button></div><div class="prototype-note">Prototipo funcional: no se envía, almacena ni procesa información personal o médica. No realiza una inscripción real.</div></form><div id="success" hidden></div></div>`;
function initBirthdatePicker(){
 const field=document.querySelector('#signup .birthdate-field');
 if(!field)return;
 const input=field.querySelector('#nacimiento'),trigger=field.querySelector('#birthdate-trigger'),popup=field.querySelector('#birthdate-popup'),overlay=field.querySelector('#birthdate-overlay');
 const days=field.querySelector('#birthdate-days'),value=field.querySelector('#birthdate-value'),inlineClear=field.querySelector('#birthdate-inline-clear');
 const confirm=field.querySelector('#birthdate-confirm'),clear=field.querySelector('#birthdate-clear'),back=field.querySelector('#birthdate-back'),title=field.querySelector('#birthdate-title');
 const today=new Date(),todayYear=today.getFullYear(),todayMonth=today.getMonth();
 const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const selects={
  month:{trigger:field.querySelector('#birthdate-month'),label:field.querySelector('#birthdate-month-label'),menu:field.querySelector('#birthdate-month-menu')},
  year:{trigger:field.querySelector('#birthdate-year'),label:field.querySelector('#birthdate-year-label'),menu:field.querySelector('#birthdate-year-menu')}
 };
 for(const control of Object.values(selects))control.originalParent=control.menu.parentElement;
 let viewYear=todayYear-18,viewMonth=todayMonth,selected=null,pending=null,openSelect=null;
 const pad=n=>String(n).padStart(2,'0');
 const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
 const isMobile=()=>window.matchMedia('(max-width:680px)').matches;
 const isAllowed=(y,m,d)=>{const date=new Date(y,m,d);return y>=1900&&date<=today&&date.getFullYear()===y&&date.getMonth()===m;};
 function closeSelect(focus=false){
  for(const control of Object.values(selects)){control.menu.hidden=true;control.trigger.setAttribute('aria-expanded','false');if(control.menu.parentElement!==control.originalParent)control.originalParent.appendChild(control.menu);}
  if(openSelect&&focus)selects[openSelect].trigger.focus();
  openSelect=null;overlay.classList.remove('is-selecting');popup.classList.remove('birthdate-picker-mode');back.hidden=true;title.textContent='Seleccionar fecha';
 }
 function showSelect(kind){
  if(openSelect===kind){closeSelect(true);return;}
  closeSelect(false);
  const control=selects[kind],menu=control.menu;menu.replaceChildren();
  const values=kind==='month'?months.map((name,index)=>({name,value:index})):
   Array.from({length:todayYear-1899},(_,index)=>({name:String(todayYear-index),value:todayYear-index}));
  for(const item of values){
   if(kind==='month'&&viewYear===todayYear&&item.value>todayMonth)continue;
   const opt=document.createElement('button');opt.type='button';opt.className='birthdate-choice-option';opt.setAttribute('role','option');
   opt.setAttribute('aria-selected',String(item.value===(kind==='month'?viewMonth:viewYear)));opt.innerHTML='<span class="birthdate-option-label"></span><span class="birthdate-option-radio" aria-hidden="true"></span>';opt.querySelector('.birthdate-option-label').textContent=item.name;
   opt.addEventListener('click',()=>{
    if(kind==='month')viewMonth=item.value;else{viewYear=item.value;if(viewYear===todayYear&&viewMonth>todayMonth)viewMonth=todayMonth;}
    closeSelect(false);draw();if(!isMobile())control.trigger.focus();
   });menu.appendChild(opt);
  }
  menu.dataset.kind=kind==='month'?'el mes':'el año';
  if(isMobile())popup.appendChild(menu);
  menu.hidden=false;control.trigger.setAttribute('aria-expanded','true');openSelect=kind;
  if(isMobile()){popup.classList.add('birthdate-picker-mode');back.hidden=false;title.textContent=kind==='month'?'Seleccionar mes':'Seleccionar año';}
  const active=menu.querySelector('[aria-selected="true"]');
  if(active){menu.scrollTop=Math.max(0,active.offsetTop-menu.offsetTop-95);}
 }
 function draw(){
   selects.month.label.textContent=months[viewMonth];selects.year.label.textContent=viewYear;
   days.replaceChildren();
   const offset=(new Date(viewYear,viewMonth,1).getDay()+6)%7,total=new Date(viewYear,viewMonth+1,0).getDate();
   for(let k=0;k<offset;k++){const blank=document.createElement('span');blank.setAttribute('aria-hidden','true');days.appendChild(blank);}
   for(let d=1;d<=total;d++){
    const dateIso=iso(viewYear,viewMonth,d),btn=document.createElement('button');btn.type='button';btn.className='birthdate-day';
    btn.textContent=d;btn.setAttribute('aria-label',d+' de '+months[viewMonth]+' de '+viewYear);
    btn.setAttribute('aria-selected',String(pending===dateIso));btn.setAttribute('role','gridcell');
    if(pending===dateIso)btn.classList.add('is-selected');
    if(dateIso===iso(todayYear,todayMonth,today.getDate()))btn.classList.add('is-today');
    if(!isAllowed(viewYear,viewMonth,d))btn.disabled=true;
    btn.addEventListener('click',()=>{pending=dateIso;confirm.disabled=false;draw();});
    days.appendChild(btn);
   }
   field.querySelectorAll('[data-birth-nav]').forEach(btn=>{
    const date=new Date(viewYear,viewMonth+Number(btn.dataset.birthNav),1);
    btn.disabled=date.getFullYear()<1900||date.getFullYear()>todayYear||(date.getFullYear()===todayYear&&date.getMonth()>todayMonth);
   });
   confirm.disabled=!pending;
 }
 let birthExitTimer=null;
 function finishBirthHide(){
  if(birthExitTimer){clearTimeout(birthExitTimer);birthExitTimer=null;}
  popup.hidden=true;overlay.hidden=true;
  popup.classList.remove('birthdate-dragging','birthdate-dismiss');
  overlay.classList.remove('birthdate-overlay-dismiss');
  popup.style.removeProperty('transform');overlay.style.removeProperty('opacity');
 }
 function show(){
  if(birthExitTimer)finishBirthHide();
  if(selected){const parts=selected.split('-').map(Number);viewYear=parts[0];viewMonth=parts[1]-1;}
  pending=selected;
  popup.style.setProperty('--birth-drawer-shadow','.25');
  popup.hidden=false;overlay.hidden=!isMobile();trigger.setAttribute('aria-expanded','true');draw();
 }
 function hide(focus=false,immediate=false){
  closeSelect();trigger.setAttribute('aria-expanded','false');
  if(focus)trigger.focus();
  // Igual que «Ver resultados» de filtros: al confirmar, retirar el panel
  // y su scrim en el mismo frame, sin animación residual de salida.
  if(!isMobile()||immediate||!birthGesture||window.matchMedia('(prefers-reduced-motion:reduce)').matches){finishBirthHide();return;}
  if(birthExitTimer)return;
  popup.classList.remove('birthdate-dragging');
  popup.style.removeProperty('transform');overlay.style.removeProperty('opacity');
  popup.classList.add('birthdate-dismiss');
  popup.style.setProperty('--birth-drawer-shadow','0');
  overlay.classList.add('birthdate-overlay-dismiss');
  birthExitTimer=window.setTimeout(finishBirthHide,310);
 }
 function syncInlineClear(){inlineClear.hidden=!selected||trigger.disabled;}
 function resetDate(){selected=null;pending=null;input.value='';value.textContent='Seleccionar fecha';value.classList.add('birthdate-placeholder');input.dispatchEvent(new Event('input',{bubbles:true}));syncInlineClear();hide(true);}
 function accept(){
  if(!pending)return;
  selected=pending;input.value=selected;const [year,month,day]=selected.split('-').map(Number);
  value.textContent=pad(day)+'/'+pad(month)+'/'+year;value.classList.remove('birthdate-placeholder');syncInlineClear();
  input.dispatchEvent(new Event('input',{bubbles:true}));hide(true);
 }
 const birthDrag=field.querySelector('#birthdate-drag-handle');
 let birthGesture=null,birthClosing=false;
 birthDrag.addEventListener('pointerdown',e=>{
  if(!isMobile()||popup.hidden||birthClosing||e.button!==0)return;
  birthGesture={id:e.pointerId,start:e.clientY,delta:0,startTime:performance.now()};
  popup.classList.add('birthdate-dragging');
  birthDrag.setPointerCapture(e.pointerId);e.preventDefault();
 });
 birthDrag.addEventListener('pointermove',e=>{
  if(!birthGesture||birthGesture.id!==e.pointerId)return;
  const delta=Math.max(0,e.clientY-birthGesture.start);
  birthGesture.delta=delta;
  popup.style.transform='translate3d(0,'+delta+'px,0)';
  popup.style.setProperty('--birth-drawer-shadow',String(.25*Math.max(0,1-delta/Math.max(1,popup.offsetHeight))));
  overlay.style.opacity=String(Math.max(0,1-delta/Math.max(1,popup.offsetHeight)));
  e.preventDefault();
 });
 function endBirthDrag(e){
  if(!birthGesture||birthGesture.id!==e.pointerId)return;
  const g=birthGesture;birthGesture=null;
  if(birthDrag.hasPointerCapture(e.pointerId))birthDrag.releasePointerCapture(e.pointerId);
  popup.classList.remove('birthdate-dragging');
  const elapsed=Math.max(1,performance.now()-g.startTime);
  const shouldClose=g.delta>Math.min(168,Math.max(120,popup.offsetHeight*.24))||(g.delta>55&&g.delta/elapsed>.8);
  if(shouldClose){
   birthClosing=true;
   // El gesto conserva el cierre deslizante; los botones cierran de inmediato.
   popup.classList.add('birthdate-dismiss');
   overlay.classList.add('birthdate-overlay-dismiss');
   window.setTimeout(()=>{hide(false,true);birthClosing=false;},310);
  }else{
   popup.style.transition='transform .3s ease-out';
   overlay.style.transition='opacity .3s ease-out';
   popup.style.transform='translate3d(0,0,0)';overlay.style.opacity='1';
   window.setTimeout(()=>{popup.style.removeProperty('transition');popup.style.removeProperty('transform');overlay.style.removeProperty('transition');overlay.style.removeProperty('opacity');},310);
  }
  e.preventDefault();
 }
 birthDrag.addEventListener('pointerup',endBirthDrag);
 birthDrag.addEventListener('pointercancel',endBirthDrag);
 trigger.addEventListener('click',()=>popup.hidden?show():hide(false));
 back.addEventListener('click',()=>closeSelect(false));
 for(const kind of Object.keys(selects)){selects[kind].trigger.addEventListener('click',()=>showSelect(kind));}
 field.querySelectorAll('[data-birth-nav]').forEach(btn=>btn.addEventListener('click',()=>{
  closeSelect();const next=new Date(viewYear,viewMonth+Number(btn.dataset.birthNav),1);
  viewYear=next.getFullYear();viewMonth=next.getMonth();draw();
 }));
 confirm.addEventListener('click',accept);
 clear.addEventListener('click',resetDate);
 inlineClear.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(trigger.disabled)return;resetDate();});
 field.querySelector('#birthdate-x').addEventListener('click',()=>hide(true));
 overlay.addEventListener('click',()=>{if(openSelect){closeSelect();return;}hide(true);});
 document.addEventListener('pointerdown',e=>{
  if(popup.hidden||isMobile())return;
  if(openSelect&&!selects[openSelect].menu.contains(e.target)&&!selects[openSelect].trigger.contains(e.target)){
   closeSelect();if(popup.contains(e.target))return;
  }
  if(!field.contains(e.target))hide(false);
 });
 document.addEventListener('keydown',e=>{
  if(popup.hidden)return;
