<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Espacio de trabajo del prototipo de la Consola de Deportes de la Municipalidad de Lomas de Zamora." />
  <title>Consola de Deportes | MLZ</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #3d3d3d; background: #f6f8fa; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 720px; padding: clamp(28px, 6vw, 64px); border: 1px solid #e4e8ec; border-radius: 20px; background: white; text-align: center; box-shadow: 0 8px 30px rgba(19,39,57,.035); }
    .eyebrow { margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #236999; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 42px); line-height: 1.16; letter-spacing: -.035em; }
    .subtitle { margin: 20px auto 0; max-width: 480px; color: #64717d; font-size: 16px; line-height: 1.6; }
    .divider { margin: 32px auto 0; width: 52px; height: 4px; border-radius: 4px; background: #358dc2; }
    footer { margin-top: 28px; color: #83909b; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Municipalidad de Lomas de Zamora · Deportes</p>
    <h1>Acá podemos empezar a trabajar.</h1>
    <p class="subtitle">Consola de Deportes · Espacio inicial para diseñar y construir el back office de gestión de actividades e inscripciones.</p>
    <div class="divider" aria-hidden="true"></div>
    <footer>Prototipo de trabajo · No procesa inscripciones ni datos personales reales.</footer>
  </main>
</body>
</html>
