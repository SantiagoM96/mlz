<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAE · Generador editorial</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f4;font:14px system-ui}header{padding:18px 25px;border-bottom:1px solid #34383e;font-size:20px;font-weight:700}main{display:grid;grid-template-columns:minmax(280px,360px) minmax(300px,1fr);gap:24px;padding:24px;max-width:1250px;margin:auto}aside{background:#1e2025;padding:22px;border-radius:12px;align-self:start}label{display:block;margin:17px 0 7px;font-weight:600}input,textarea,select,button{font:inherit}input[type=file],input[type=url],textarea,select{width:100%;background:#292c32;color:white;border:1px solid #4a4e56;border-radius:7px;padding:10px}textarea{min-height:90px;resize:vertical}button{background:#d82626;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#363a43}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hint{color:#adb0ba;font-size:12px;line-height:1.5}canvas{width:min(100%,540px);height:auto;display:block;box-shadow:0 12px 45px #0007;touch-action:none;cursor:grab}.preview{display:flex;flex-direction:column;align-items:center;gap:12px}.toolbar{display:flex;gap:10px;align-items:center}.toolbar button{min-width:36px}details{margin-top:18px}summary{cursor:pointer}input[type=range]{width:100%}@media(max-width:790px){main{grid-template-columns:1fr;padding:12px}aside{padding:16px}}</style></head><body><header>BAE · Generador editorial</header><main><aside><label>Variante de color</label><select id="theme"><option value="dark">Negro</option><option value="white">Blanco</option><option value="red">Rojo</option></select><label for="articleUrl">URL de la noticia</label><input id="articleUrl" type="url" placeholder="https://www.baenegocios.com/..." style="width:100%;background:#292c32;color:#fff;border:1px solid #4a4e56;border-radius:7px;padding:10px"><button id="importArticle" type="button" style="margin-top:10px">Importar título y foto</button><p class="hint" id="importStatus" role="status" aria-live="polite">Pegá una URL de BAE Negocios.</p><button id="pastePhoto" type="button" style="background:#343840;margin-top:8px">Pegar foto copiada</button><p class="hint" id="pasteStatus">También podés copiar una imagen desde la noticia y pegarla acá.</p><label>Fotografía</label><input id="file" type="file" accept="image/*"><p class="hint">Arrastrá la imagen directamente en la vista previa para ajustar su encuadre.</p><label>Texto principal</label><textarea id="headline">Donald Trump comparó a los inmigrantes con aliens:</textarea><label><input id="enableQuote" type="checkbox" checked> Incluir textual</label><textarea id="quote">“Hay que deportarlos a todos”</textarea><label for="textAlign">Alineación del texto</label><select id="textAlign"><option value="left">Izquierda</option><option value="center">Centro</option></select><label>Tamaño tipográfico: <output id="sizeLabel">70</output> px</label><input id="size" type="range" min="42" max="105" value="70"><label><input id="bold" type="checkbox"> Negrita simulada</label><details><summary>Ajustes de diseño</summary><label>Color del halftone</label><div class="row"><input id="dotColor" type="color" value="#ffffff" style="height:42px;min-width:65px;padding:2px;flex:0 0 65px"><button class="secondary" id="resetDotColor" type="button">Color según variante</button></div><label for="dots">Opacidad del halftone: <output id="dotsLabel">10%</output></label><input id="dots" type="range" min="0" max="100" value="10"></details><button id="download">Exportar PNG 1080 × 1440</button></aside><section class="preview"><div class="toolbar"><button class="secondary" id="minus">−</button><span id="zoomLabel">100 %</span><button class="secondary" id="plus">+</button></div><canvas id="art" width="1080" height="1440"></canvas><p class="hint" id="status">Vista previa editable</p></section></main><script>
(function(){
'use strict';
const el=id=>document.getElementById(id),canvas=el('art'),ctx=canvas.getContext('2d'),W=1080,H=1440;
let halftone=null;let customDotColor=false;const halftoneLayer=document.createElement('canvas');halftoneLayer.width=1080;halftoneLayer.height=1236;const halftoneCtx=halftoneLayer.getContext('2d');const halftoneAsset=new Image();halftoneAsset.onload=()=>{halftone=halftoneAsset;render()};halftoneAsset.onerror=()=>console.error('No se pudo cargar halftone-editable.svg');halftoneAsset.src='./halftone-editable.svg?v=2';let image=null,zoom=1,offsetX=0,offsetY=0,dragging=false,lastX=0,lastY=0,photoBottom=820;
const palette={dark:{bg:'#171717',text:'#fff',accent:'#D82626'},white:{bg:'#fff',text:'#171717',accent:'#D82626'},red:{bg:'#D82626',text:'#fff',accent:'#fff'}};
function wrap(text,style,size){ctx.font=style+' '+size+'px "DM Serif Display",Georgia,serif';const out=[];for(const paragraph of String(text).split('\n')){let row='';for(const word of paragraph.trim().split(/\s+/).filter(Boolean)){const candidate=row?row+' '+word:word;if(row&&ctx.measureText(candidate).width>920){out.push(row);row=word}else row=candidate}if(row)out.push(row)}return out}
function render(){
try{
const colors=palette[el('theme').value]||palette.dark,size=Number(el('size').value),lineHeight=Math.round(size*1.12*0.8),main=wrap(el('headline').value,'normal',size),quotes=el('enableQuote').checked?wrap(el('quote').value,'italic',size):[];
// Coordenadas en píxeles reales del PNG (1080 × 1440), no píxeles CSS.
// Piso de la firma exactamente a 80 px del borde inferior.
ctx.textBaseline='alphabetic';
ctx.font='30px Arial';
const footerMetrics=ctx.measureText('baenegocios.com');
const footerAscent=footerMetrics.actualBoundingBoxAscent||29;
const footerDescent=footerMetrics.actualBoundingBoxDescent||0;
const footerBaseline=H-80-footerDescent;
const footerTop=footerBaseline-footerAscent;
// Construir las líneas en orden visual y posicionarlas desde abajo.
const lines=[
 ...main.map(text=>({text,italic:false})),
 ...quotes.map(text=>({text,italic:true}))
];
const lineMetrics=lines.map(line=>{
 ctx.font=(line.italic?'italic ':'')+size+'px "DM Serif Display",Georgia,serif';
 const m=ctx.measureText(line.text||' ');
 return {ascent:m.actualBoundingBoxAscent||size,descent:m.actualBoundingBoxDescent||Math.ceil(size*.2)};
});
const baselines=new Array(lines.length);
if(lines.length){
 const last=lines.length-1;
 baselines[last]=footerTop-50-lineMetrics[last].descent;
 for(let i=last-1;i>=0;i--){
  const groupGap=!lines[i].italic&&lines[i+1].italic?20:0;
  baselines[i]=baselines[i+1]-lineHeight-groupGap;
 }
}
const firstBaseline=baselines[0]??footerTop-50;
const firstAscent=lineMetrics[0]?.ascent??size;
const boxTop=Math.max(80,firstBaseline-firstAscent-50);
photoBottom=boxTop-16;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='#aeb4bc';ctx.fillRect(0,0,W,photoBottom);
if(image){
const base=Math.max(W/image.width,photoBottom/image.height),scale=base*zoom,iw=image.width*scale,ih=image.height*scale;
const maxX=Math.max(0,(iw-W)/2),maxY=Math.max(0,(ih-photoBottom)/2);
offsetX=Math.max(-maxX,Math.min(maxX,offsetX));offsetY=Math.max(-maxY,Math.min(maxY,offsetY));
ctx.save();ctx.beginPath();ctx.rect(0,0,W,photoBottom);ctx.clip();ctx.drawImage(image,(W-iw)/2+offsetX,(photoBottom-ih)/2+offsetY,iw,ih);ctx.restore();
}else{ctx.fillStyle='#343a40';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('Cargá una fotografía',W/2,photoBottom/2);ctx.textAlign='left'}
ctx.fillStyle=colors.bg;ctx.fillRect(0,boxTop,W,H-boxTop);
ctx.save();ctx.beginPath();ctx.rect(0,boxTop,W,H-boxTop);ctx.clip();
ctx.globalAlpha=Number(el('dots').value)/100;if(halftone){halftoneCtx.clearRect(0,0,1080,1236);halftoneCtx.globalCompositeOperation='source-over';halftoneCtx.drawImage(halftone,0,0,1080,1235.84);halftoneCtx.globalCompositeOperation='source-in';halftoneCtx.fillStyle=el('dotColor').value;halftoneCtx.fillRect(0,0,1080,1236);halftoneCtx.globalCompositeOperation='source-over';ctx.drawImage(halftoneLayer,0,115,1080,1121,0,boxTop,1080,1121)}ctx.restore();
ctx.fillStyle='#fff';ctx.fillRect(0,boxTop-16,W,16);
const centered=el('textAlign').value==='center';
ctx.textAlign=centered?'center':'left';ctx.textBaseline='alphabetic';
for(let i=0;i<lines.length;i++){
 const line=lines[i];
 ctx.font=(line.italic?'italic ':'')+size+'px "DM Serif Display",Georgia,serif';
 ctx.fillStyle=line.italic?colors.accent:colors.text;
 ctx.fillText(line.text,centered?W/2:80,baselines[i]);
 if(!line.italic&&el('bold').checked){ctx.lineWidth=1;ctx.strokeStyle=colors.text;ctx.strokeText(line.text,centered?W/2:80,baselines[i])}
}
ctx.fillStyle=colors.text;ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('baenegocios.com',W/2,footerBaseline);ctx.textAlign='left';
el('dotsLabel').textContent=el('dots').value+'%';el('sizeLabel').textContent=size;el('zoomLabel').textContent=Math.round(zoom*100)+' %';el('status').textContent=boxTop<=80?'Texto demasiado largo: reducí el tamaño.':'Vista previa activa · Arrastrá la foto para moverla.';
}catch(error){el('status').textContent='Error de vista previa: '+error.message;console.error(error)}
}
for(const id of ['headline','quote','enableQuote','size','bold','dots','textAlign'])el(id).addEventListener('input',render);el('dotColor').addEventListener('input',()=>{customDotColor=true;render()});el('theme').addEventListener('change',()=>{if(!customDotColor)el('dotColor').value=el('theme').value==='white'?'#171717':'#ffffff';render()});el('resetDotColor').addEventListener('click',()=>{customDotColor=false;el('dotColor').value=el('theme').value==='white'?'#171717':'#ffffff';render()});
el('file').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{image=img;zoom=1;offsetX=0;offsetY=0;render();URL.revokeObjectURL(url)};img.onerror=()=>{el('status').textContent='No se pudo abrir esta fotografía';URL.revokeObjectURL(url)};img.src=url});
el('plus').addEventListener('click',()=>{zoom=Math.min(3,zoom+.1);render()});
el('minus').addEventListener('click',()=>{zoom=Math.max(1,zoom-.1);render()});
canvas.addEventListener('pointerdown',event=>{if(!image)return;const r=canvas.getBoundingClientRect();if((event.clientY-r.top)*H/r.height>photoBottom)return;dragging=true;lastX=event.clientX;lastY=event.clientY;canvas.setPointerCapture(event.pointerId)});
canvas.addEventListener('pointermove',event=>{if(!dragging)return;const ratio=W/canvas.getBoundingClientRect().width;offsetX+=(event.clientX-lastX)*ratio;offsetY+=(event.clientY-lastY)*ratio;lastX=event.clientX;lastY=event.clientY;render()});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
el('download').addEventListener('click',()=>{render();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='BAE-posteo.png';a.click()});
window.BAEEditor={setImage(img){image=img;zoom=1;offsetX=0;offsetY=0;render()},refresh:render};render();document.fonts.ready.then(render);
})();</script><script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const article=$('articleUrl'),button=$('importArticle'),status=$('importStatus');
const timeout=ms=>AbortSignal.timeout(ms);
function fixEncoding(s){s=String(s||'');if(!/[ÃÂâ][\x80-\xBF\xA0-\xFF]/.test(s))return s;try{const bytes=Uint8Array.from([...s].map(c=>c.charCodeAt(0)));const fixed=new TextDecoder('utf-8',{fatal:true}).decode(bytes);return fixed.includes('�')?s:fixed}catch{return s}}
function getMeta(html,base){
const doc=new DOMParser().parseFromString(html,'text/html');
const meta=key=>doc.querySelector('meta[property="'+key+'"],meta[name="'+key+'"]')?.getAttribute('content')?.trim()||'';
const title=fixEncoding((meta('og:title')||meta('twitter:title')||doc.querySelector('h1')?.textContent||doc.title||'').replace(/\s*[|\-–]\s*BAE Negocios\s*$/i,'').trim());
let image=meta('og:image:secure_url')||meta('og:image')||meta('twitter:image')||doc.querySelector('article img[src], .image img[src], .media img[src], img[data-src]')?.getAttribute('data-src')||doc.querySelector('article img[src], .image img[src], .media img[src]')?.getAttribute('src')||'';
try{image=image?new URL(image,base).href:''}catch{image=''}
return {title,image};
}
async function fetchText(url){const res=await fetch(url,{signal:timeout(10000)});if(!res.ok)throw Error('HTTP '+res.status);return res.text()}
async function extract(url){
const services=[
async()=>{const response=JSON.parse(await fetchText('https://api.microlink.io?url='+encodeURIComponent(url)));if(response.status!=='success')throw Error(response.message||'Microlink sin datos');return {title:fixEncoding(response.data?.title||''),image:response.data?.image?.url||''}},
async()=>getMeta(await fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(url)),url),
async()=>getMeta(await fetchText('https://corsproxy.io/?url='+encodeURIComponent(url)),url),
async()=>{const txt=await fetchText('https://r.jina.ai/'+url);const title=fixEncoding(txt.match(/^Title:\s*(.+)$/mi)?.[1]||'');const images=[...txt.matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g)].map(m=>m[1]);return {title,image:images.find(u=>!/(logo|icon|avatar|favicon|pixel|tracking)/i.test(u))||images[0]||''}}
];
const errors=[],result={title:'',image:''};
for(const service of services){try{const data=await service();if(data.title&&!result.title)result.title=fixEncoding(data.title).replace(/\s*[|\-–]\s*BAE Negocios\s*$/i,'').trim();if(data.image&&!result.image)result.image=data.image;if(result.title&&result.image)break}catch(e){errors.push(e.message)}}
if(result.title)return result;
throw Error('No fue posible obtener el título. '+errors.join('; '));
}
function loadRemoteImage(url){return new Promise((resolve,reject)=>{const img=new Image();const timer=setTimeout(()=>reject(Error('Imagen remota agotó el tiempo')),9000);img.onload=()=>{clearTimeout(timer);resolve(img)};img.onerror=()=>{clearTimeout(timer);reject(Error('No se pudo abrir la imagen'))};img.src=url})}
async function fetchImage(url){
const options=[url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?url='+encodeURIComponent(url)];
for(const endpoint of options){try{const res=await fetch(endpoint,{signal:timeout(12000)});if(!res.ok)continue;const blob=await res.blob();if(blob.type.includes('text/html')||blob.type.includes('application/json'))continue;const objectURL=URL.createObjectURL(blob);try{const img=new Image();img.src=objectURL;await img.decode();return img}finally{URL.revokeObjectURL(objectURL)}}catch(e){console.warn('Image attempt:',e)}}
try{return await loadRemoteImage(url)}catch{}throw Error('La foto no pudo descargarse por restricciones de acceso');
}
$('pastePhoto').addEventListener('click',async()=>{const message=$('pasteStatus');try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(!type)continue;const blob=await item.getType(type);const objectURL=URL.createObjectURL(blob);try{const img=new Image();img.src=objectURL;await img.decode();window.BAEEditor.setImage(img);message.textContent='Foto pegada correctamente.';return}finally{URL.revokeObjectURL(objectURL)}}message.textContent='El portapapeles no contiene una imagen.'}catch(e){message.textContent='No se pudo leer la imagen copiada: '+e.message}});
button.addEventListener('click',async()=>{
let url;try{url=new URL(article.value.trim());if(url.protocol!=='https:'||!['www.baenegocios.com','baenegocios.com'].includes(url.hostname))throw Error('Ingresá una URL HTTPS de baenegocios.com')}catch(e){status.textContent=e.message;return}
button.disabled=true;status.textContent='Buscando el título y la fotografía…';
try{
const data=await extract(url.href);
$('headline').value=data.title;$('enableQuote').checked=false;window.BAEEditor.refresh();
if(data.image){status.textContent='Título importado. Descargando fotografía…';try{const img=await fetchImage(data.image);window.BAEEditor.setImage(img);status.textContent='Título y fotografía importados correctamente.'}catch(e){status.textContent='Título importado, pero no se pudo descargar la foto ('+e.message+'). Podés cargarla manualmente.'}}
else status.textContent='Título importado. No se encontró una foto principal.';
}catch(e){status.textContent='No se pudo importar la noticia. '+e.message}
finally{button.disabled=false}
});
})();
</script></body></html>
