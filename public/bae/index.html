<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAE · Generador editorial</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f4;font:14px system-ui}header{padding:18px 25px;border-bottom:1px solid #34383e;font-size:20px;font-weight:700}main{display:grid;grid-template-columns:minmax(280px,360px) minmax(300px,1fr);gap:24px;padding:24px;max-width:1250px;margin:auto}aside{background:#1e2025;padding:22px;border-radius:12px;align-self:start}label{display:block;margin:17px 0 7px;font-weight:600}input,textarea,select,button{font:inherit}input[type=file],input[type=url],textarea,select{width:100%;background:#292c32;color:white;border:1px solid #4a4e56;border-radius:7px;padding:10px}textarea{min-height:90px;resize:vertical}button{background:#d82626;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#363a43}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hint{color:#adb0ba;font-size:12px;line-height:1.5}canvas{width:min(100%,540px);height:auto;display:block;box-shadow:0 12px 45px #0007;touch-action:none;cursor:grab}.preview{display:flex;flex-direction:column;align-items:center;gap:12px}.toolbar{display:flex;gap:10px;align-items:center}.toolbar button{min-width:36px}details{margin-top:18px}summary{cursor:pointer}input[type=range]{width:100%}@media(max-width:790px){main{grid-template-columns:1fr;padding:12px}aside{padding:16px}}</style></head><body><header>BAE · Generador editorial</header><main><aside><label>Variante de color</label><select id="theme"><option value="dark">Negro</option><option value="white">Blanco</option><option value="red">Rojo</option></select><label>Fotografía</label><input id="file" type="file" accept="image/*"><p class="hint">Arrastrá la imagen directamente en la vista previa para ajustar su encuadre.</p><label>Texto principal</label><textarea id="headline">Donald Trump comparó a los inmigrantes con aliens:</textarea><label><input id="enableQuote" type="checkbox" checked> Incluir textual</label><textarea id="quote">“Hay que deportarlos a todos”</textarea><label>Tamaño tipográfico: <output id="sizeLabel">70</output> px</label><input id="size" type="range" min="42" max="105" value="70"><label><input id="bold" type="checkbox"> Negrita simulada</label><details><summary>Ajustes de diseño</summary><label>Opacidad de textura de superficie</label><input id="surface" type="range" min="0" max="100" value="18"><label>Opacidad del halftone</label><input id="dots" type="range" min="0" max="100" value="15"><label>Desplazamiento del halftone</label><input id="offset" type="range" min="0" max="400" value="90"></details><button id="download">Exportar PNG 1080 × 1440</button></aside><section class="preview"><div class="toolbar"><button class="secondary" id="minus">−</button><span id="zoomLabel">100 %</span><button class="secondary" id="plus">+</button></div><canvas id="art" width="1080" height="1440"></canvas><p class="hint" id="status">Vista previa editable</p></section></main><script>
(function(){
'use strict';
const el=id=>document.getElementById(id),canvas=el('art'),ctx=canvas.getContext('2d'),W=1080,H=1440;
let image=null,zoom=1,offsetX=0,offsetY=0,dragging=false,lastX=0,lastY=0,photoBottom=820;
const palette={dark:{bg:'#171717',text:'#fff',accent:'#D82626'},white:{bg:'#fff',text:'#171717',accent:'#D82626'},red:{bg:'#D82626',text:'#fff',accent:'#fff'}};
function wrap(text,style,size){ctx.font=style+' '+size+'px "DM Serif Display",Georgia,serif';const out=[];for(const paragraph of String(text).split('\n')){let row='';for(const word of paragraph.trim().split(/\s+/).filter(Boolean)){const candidate=row?row+' '+word:word;if(row&&ctx.measureText(candidate).width>920){out.push(row);row=word}else row=candidate}if(row)out.push(row)}return out}
function render(){
try{
const colors=palette[el('theme').value]||palette.dark,size=Number(el('size').value),lineHeight=Math.round(size*1.12),main=wrap(el('headline').value,'normal',size),quotes=el('enableQuote').checked?wrap(el('quote').value,'italic',size):[];
const bodyHeight=(main.length+quotes.length)*lineHeight+(quotes.length?20:0);
const boxHeight=Math.max(270,bodyHeight+190);
const boxTop=Math.max(80,H-boxHeight);photoBottom=boxTop-16;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='#aeb4bc';ctx.fillRect(0,0,W,photoBottom);
if(image){
const base=Math.max(W/image.width,photoBottom/image.height),scale=base*zoom,iw=image.width*scale,ih=image.height*scale;
const maxX=Math.max(0,(iw-W)/2),maxY=Math.max(0,(ih-photoBottom)/2);
offsetX=Math.max(-maxX,Math.min(maxX,offsetX));offsetY=Math.max(-maxY,Math.min(maxY,offsetY));
ctx.save();ctx.beginPath();ctx.rect(0,0,W,photoBottom);ctx.clip();ctx.drawImage(image,(W-iw)/2+offsetX,(photoBottom-ih)/2+offsetY,iw,ih);ctx.restore();
}else{ctx.fillStyle='#343a40';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('Cargá una fotografía',W/2,photoBottom/2);ctx.textAlign='left'}
ctx.fillStyle=colors.bg;ctx.fillRect(0,boxTop,W,H-boxTop);
ctx.save();ctx.beginPath();ctx.rect(0,boxTop,W,H-boxTop);ctx.clip();
ctx.globalAlpha=Number(el('surface').value)/100;ctx.fillStyle=colors.text;
for(let y=boxTop+5;y<H;y+=21)for(let x=0;x<W;x+=21){const n=Math.sin(x*13.7+y*7.1)*10000;if(n-Math.floor(n)>.75)ctx.fillRect(x,y,2,2)}
ctx.globalAlpha=Number(el('dots').value)/100;const dotStart=boxTop+Number(el('offset').value);for(let y=dotStart;y<H;y+=16)for(let x=0;x<W;x+=16){ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}ctx.restore();
ctx.fillStyle='#fff';ctx.fillRect(0,boxTop-16,W,16);
let y=boxTop+80+size;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font=size+'px "DM Serif Display",Georgia,serif';ctx.fillStyle=colors.text;
for(const line of main){ctx.fillText(line,80,y);if(el('bold').checked){ctx.lineWidth=1;ctx.strokeStyle=colors.text;ctx.strokeText(line,80,y)}y+=lineHeight}
if(quotes.length){y+=20;ctx.font='italic '+size+'px "DM Serif Display",Georgia,serif';ctx.fillStyle=colors.accent;for(const line of quotes){ctx.fillText(line,80,y);y+=lineHeight}}
ctx.fillStyle=colors.text;ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('baenegocios.com',W/2,H-42);ctx.textAlign='left';
el('sizeLabel').textContent=size;el('zoomLabel').textContent=Math.round(zoom*100)+' %';el('status').textContent=boxTop<=80?'Texto demasiado largo: reducí el tamaño.':'Vista previa activa · Arrastrá la foto para moverla.';
}catch(error){el('status').textContent='Error de vista previa: '+error.message;console.error(error)}
}
for(const id of ['theme','headline','quote','enableQuote','size','bold','surface','dots','offset'])el(id).addEventListener('input',render);
el('file').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{image=img;zoom=1;offsetX=0;offsetY=0;render();URL.revokeObjectURL(url)};img.onerror=()=>{el('status').textContent='No se pudo abrir esta fotografía';URL.revokeObjectURL(url)};img.src=url});
el('plus').addEventListener('click',()=>{zoom=Math.min(3,zoom+.1);render()});
el('minus').addEventListener('click',()=>{zoom=Math.max(1,zoom-.1);render()});
canvas.addEventListener('pointerdown',event=>{if(!image)return;const r=canvas.getBoundingClientRect();if((event.clientY-r.top)*H/r.height>photoBottom)return;dragging=true;lastX=event.clientX;lastY=event.clientY;canvas.setPointerCapture(event.pointerId)});
canvas.addEventListener('pointermove',event=>{if(!dragging)return;const ratio=W/canvas.getBoundingClientRect().width;offsetX+=(event.clientX-lastX)*ratio;offsetY+=(event.clientY-lastY)*ratio;lastX=event.clientX;lastY=event.clientY;render()});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
el('download').addEventListener('click',()=>{render();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='BAE-posteo.png';a.click()});
render();document.fonts.ready.then(render);
})();</script></body></html>
