<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Shift y clic: expandir o contraer todos los módulos</title>
<desc id="desc">Shift se ilumina. Una flecha negra pequeña recorre una curva desde abajo a la derecha hasta el chevrón de Diseño de placas. El mouse hace clic y los acordeones crecen, revelando sus controles dentro. Después se cierran y la secuencia vuelve a empezar.</desc>
<style>
 .module{fill:#292d38;stroke:#747c8c;stroke-width:2;height:36px;animation:panel-open 5.6s ease-in-out infinite}
 .heading{fill:#e7ebf4;font:600 14px system-ui,sans-serif}
 .label{fill:#b6becd;font:500 10px system-ui,sans-serif}
 .control{fill:#3b4250;stroke:#697386;stroke-width:1}
 .selected{fill:#68778f;stroke:#c3cddd;stroke-width:1}
 .chevron{fill:none;stroke:#e4e9f2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:chevron-open 5.6s ease-in-out infinite}
 .reveal{height:0px;animation:reveal-open 5.6s ease-in-out infinite}
 .body{animation:body-visible 5.6s linear infinite}
 #module-photo{animation:photo-position 5.6s ease-in-out infinite}
 #module-text{animation:text-position 5.6s ease-in-out infinite}
 .shift{fill:#333b4a;stroke:#8996a9;stroke-width:2;animation:shift-down 5.6s ease-in-out infinite}
 .shift-icon{stroke:#edf3fc;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .shift-label{fill:#edf3fc;font:700 21px system-ui,sans-serif}
 .cursor-arrow{fill:#101115;stroke:#fff;stroke-width:1;stroke-linejoin:round}
 #pointer-motion{offset-path:path('M520 207 C480 230 386 224 340 170 C310 134 308 72 293 40');offset-rotate:0deg;animation:pointer-travel 5.6s ease-in-out infinite}
 .cursor-click{animation:cursor-tap 5.6s ease-in-out infinite;transform-origin:0 0}
 .mouse{fill:#303746;stroke:#8793a8;stroke-width:2}
 .mouse-divider{fill:none;stroke:#818b9f;stroke-width:2}
 .mouse-button{fill:#68778f;animation:mouse-light 5.6s linear infinite}
 .physical-mouse{animation:mouse-tap 5.6s ease-in-out infinite}
 .click-ring{fill:none;stroke:#f3f6fd;stroke-width:2;animation:click-flash 5.6s ease-out infinite;transform-origin:293px 40px}
 @keyframes panel-open{0%,38%,89%,100%{height:36px}50%,76%{height:100px}}
 @keyframes reveal-open{0%,38%,89%,100%{height:0px}50%,76%{height:64px}}
 @keyframes photo-position{0%,38%,89%,100%{transform:translateY(0)}50%,76%{transform:translateY(64px)}}
 @keyframes text-position{0%,38%,89%,100%{transform:translateY(0)}50%,76%{transform:translateY(128px)}}
 @keyframes chevron-open{0%,38%,89%,100%{transform:rotate(0)}50%,76%{transform:rotate(180deg)}}
 @keyframes body-visible{0%,47%,84%,100%{opacity:0}53%,76%{opacity:1}}
 @keyframes shift-down{0%,12%,65%,100%{fill:#333b4a;stroke:#8996a9}18%,59%{fill:#536279;stroke:#cad5e6}}
 @keyframes pointer-travel{0%,18%{offset-distance:0%;opacity:0}21%{opacity:1;offset-distance:0%}34%,60%{offset-distance:100%;opacity:1}66%,100%{offset-distance:100%;opacity:0}}
 @keyframes cursor-tap{0%,34%,40%,100%{transform:scale(1)}36%,38%{transform:scale(.9)}}
 @keyframes mouse-tap{0%,34%,41%,100%{transform:translateY(0)}36%,38%{transform:translateY(2px)}}
 @keyframes mouse-light{0%,34%,41%,100%{fill:#68778f}36%,38%{fill:#dce6f6}}
 @keyframes click-flash{0%,34%,44%,100%{opacity:0;transform:scale(.5)}37%{opacity:.8;transform:scale(.8)}43%{opacity:0;transform:scale(1.2)}}
 @media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  .module{height:100px}.reveal{height:64px}
  #module-photo{transform:translateY(64px)}#module-text{transform:translateY(128px)}
  .chevron{transform:rotate(180deg)}.body{opacity:1}#pointer-motion,.click-ring{opacity:0}
 }
</style>
<defs>
 <clipPath id="design-body"><rect class="reveal" x="19" y="54" width="292" height="0"/></clipPath>
 <clipPath id="photo-body"><rect class="reveal" x="19" y="98" width="292" height="0"/></clipPath>
 <clipPath id="text-body"><rect class="reveal" x="19" y="142" width="292" height="0"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="248" rx="18" fill="#20232c" stroke="#444a58" stroke-width="2"/>
<g id="modules">
 <g id="module-design">
  <rect class="module" x="18" y="18" width="294" height="36" rx="8"/>
  <text class="heading" x="32" y="41">Diseño de placas</text><path class="chevron" d="M287 34l6 6 6-6"/>
  <g clip-path="url(#design-body)"><g class="body">
   <text class="label" x="32" y="67">Variantes</text>
   <rect class="selected" x="91" y="58" width="24" height="24" rx="3"/><rect class="control" x="121" y="58" width="24" height="24" rx="3"/>
   <path d="M94 74h18M124 74h18" stroke="#df3042" stroke-width="3"/>
   <text class="label" x="32" y="98">Logo y firma</text>
   <rect class="selected" x="105" y="88" width="49" height="17" rx="4"/><text class="label" x="112" y="100">Crónica</text>
   <rect class="control" x="161" y="88" width="63" height="17" rx="4"/><text class="label" x="169" y="100">Centrada</text>
  </g></g>
 </g>
 <g id="module-photo">
  <rect class="module" x="18" y="62" width="294" height="36" rx="8"/>
  <text class="heading" x="32" y="85">Fotografía</text><path class="chevron" d="M287 78l6 6 6-6"/>
  <g clip-path="url(#photo-body)"><g class="body">
   <rect class="control" x="32" y="104" width="266" height="44" rx="5"/>
   <path d="M48 132l9-10 8 8 7-6 10 12H48Z" fill="#8996a9"/><circle cx="73" cy="115" r="3" fill="#b6becd"/>
   <text class="label" x="99" y="130">Seleccioná una fotografía</text>
  </g></g>
 </g>
 <g id="module-text">
  <rect class="module" x="18" y="106" width="294" height="36" rx="8"/>
  <text class="heading" x="32" y="129">Textos</text><path class="chevron" d="M287 122l6 6 6-6"/>
  <g clip-path="url(#text-body)"><g class="body">
   <text class="label" x="32" y="156">Volanta</text><rect class="control" x="91" y="146" width="207" height="16" rx="3"/>
   <rect class="control" x="32" y="169" width="22" height="18" rx="3"/><text class="label" x="40" y="182">B</text>
   <rect class="control" x="59" y="169" width="22" height="18" rx="3"/><text class="label" x="68" y="182">I</text>
   <rect class="control" x="91" y="169" width="207" height="25" rx="3"/><text class="label" x="99" y="185">Texto principal…</text>
  </g></g>
 </g>
</g>
<!-- Flecha proporcional de 18 × 25 px. La punta coincide con el chevrón.
     Se pinta antes de Shift para pasar por detrás de la tecla. -->
<g id="mouse-pointer"><g id="pointer-motion"><g class="cursor-click">
 <path class="cursor-arrow" d="M0 0V23L6 17L10 25L14 23L10 15H18Z"/>
</g></g></g>
<g id="shift-key">
 <rect class="shift" x="360" y="78" width="118" height="64" rx="10"/>
 <path class="shift-icon" d="M385 115v-17l-8 9m8-9 8 9"/><text class="shift-label" x="402" y="117">Shift</text>
</g>
<g id="mouse-button" class="physical-mouse">
 <rect class="mouse" x="519" y="78" width="55" height="82" rx="27"/><path class="mouse-divider" d="M546 79V111H520"/>
 <rect class="mouse-button" x="528" y="88" width="9" height="18" rx="4"/>
</g>
<circle class="click-ring" cx="293" cy="40" r="14"/>
</svg>