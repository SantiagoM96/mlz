name: Guía de Trámites — integridad y build
on:
  pull_request:
    paths:
      - 'src/pages/tramites/**'
      - 'src/data/tramites*'
      - 'src/components/ui/MaterialIcon.tsx'
      - 'scripts/validate-tramites-editorial.mjs'
      - 'package.json'
      - '.github/workflows/tramites-checks.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate editorial snapshot
        run: npm run validate:tramites
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build for GitHub Pages (without deployment)
        run: npm run build:pages
