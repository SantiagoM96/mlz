name: QA visual — Chromium y Playwright

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: Chromium — ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1415, mobile-432, mobile-390, tablet-768]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium y librerías del sistema
        run: npx playwright install --with-deps chromium
      - name: Verificar el build
        run: npm run build
      - name: Ejecutar pruebas y capturas
        run: npm run test:e2e -- --project=${{ matrix.project }} --retries=0
        env:
          CI: 'true'
      - name: Publicar capturas y reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
