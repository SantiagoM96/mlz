name: Validación enfocada — Motion Agenda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/agenda/**'
      - 'src/pages/agenda/**'
      - 'src/styles/globals.css'
      - 'tests/e2e/motion-smoke.spec.ts'
      - '.github/workflows/motion-smoke.yml'

permissions:
  contents: read

jobs:
  motion-smoke:
    name: Motion desktop y mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Compilar
        run: npm run build
      - name: Probar interacciones
        run: npx playwright test tests/e2e/motion-smoke.spec.ts --project=desktop-1415 --project=mobile-390 --workers=2 --retries=0 --reporter=list
        env:
          CI: 'true'
      - name: Guardar capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-smoke-errors
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
