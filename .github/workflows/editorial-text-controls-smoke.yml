name: BAE y Diario Show DEV — controles de textos
on:
  push:
    paths:
      - 'public/bae-dev/js/modern-editor.js'
      - 'public/bae-dev/css/modern-editor.css'
      - 'public/diarioshow-dev/js/editor.js'
      - 'public/diarioshow-dev/css/editor.css'
      - 'scripts/editorial-text-controls-smoke.mjs'
      - '.github/workflows/editorial-text-controls-smoke.yml'
  workflow_dispatch:
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Levantar editores DEV
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/editorial-controls.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/bae-dev/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validar campos, switches, variantes y estilo
        run: node scripts/editorial-text-controls-smoke.mjs
