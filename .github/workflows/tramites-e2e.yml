name: Guía de Trámites — Playwright focalizado
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/tramites/**'
      - 'src/data/tramites*'
      - 'src/components/agenda/AgendaDropdown.tsx'
      - 'tests/e2e/tramites-react.spec.ts'
      - '.github/workflows/tramites-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tramites:
    name: Trámites — ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1415, tablet-768, mobile-390]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:tramites
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/tramites-react.spec.ts --project=${{ matrix.project }} --retries=0
        env:
          CI: 'true'
